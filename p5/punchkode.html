<link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&display=swap" rel="stylesheet">

<!-- Ensure p5.js is included if not already in the layout -->
<script src="../js/punchkode_bannerreset.js"></script>
<script src="../js/punchkode_default.js"></script>
<script src="../js/punchkode.js"></script>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
    }

    /* Custom p5 DOM Slider Styles for PunchKode */
    input[type=range].punchkode-slider {
        -webkit-appearance: none !important;
        appearance: none !important;
        background: transparent !important;
        outline: none !important;
        border: none !important;
        margin: 0;
    }

    input[type=range].punchkode-slider:focus {
        outline: none !important;
    }

    /* Match the exact geometric "hourglass/diamond" shape from the mockup */
    input[type=range].punchkode-slider::-webkit-slider-thumb {
        -webkit-appearance: none !important;
        appearance: none !important;
        width: 25px !important;
        height: 35px !important;
        background-color: #ffffff !important;
        cursor: pointer;
        border-radius: 0 !important;
        margin-top: -15px !important;
        box-shadow: none !important;
        border: none !important;
        /* adjust vertical alignment over the fake drawn tracks */
        /* Create the inward-pointing geometric knob */
        clip-path: polygon(0% 0%, 100% 0%, 75% 50%, 100% 100%, 0% 100%, 25% 50%);
        transition: background-color 0.1s ease;
    }

    input[type=range].punchkode-slider::-webkit-slider-thumb:hover {
        background-color: #ffaa00 !important;
        /* Warm highlight on hover */
    }

    input[type=range].punchkode-slider::-moz-range-thumb {
        width: 25px !important;
        height: 35px !important;
        background-color: #ffffff !important;
        cursor: pointer;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
        clip-path: polygon(0% 0%, 100% 0%, 75% 50%, 100% 100%, 0% 100%, 25% 50%);
    }

    /* Hide the default HTML track entirely since the canvas is drawing fake wobbly ones underneath */
    input[type=range].punchkode-slider::-webkit-slider-runnable-track {
        width: 100% !important;
        height: 6px !important;
        cursor: pointer;
        background: transparent !important;
        background-image: none !important;
        border: none !important;
        box-shadow: none !important;
        outline: none !important;
        color: transparent !important;
    }

    input[type=range].punchkode-slider::-moz-range-track {
        width: 100% !important;
        height: 6px !important;
        cursor: pointer;
        background: transparent !important;
        background-image: none !important;
        border: none !important;
        box-shadow: none !important;
        outline: none !important;
    }
</style>
